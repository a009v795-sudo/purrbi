name: backend-ci
on:
  push:
    paths: ['backend/**', 'app/lib/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', 'app/lib/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx tsc -p tsconfig.test.json
      - name: Every app query that needs a composite index has one
        working-directory: backend/tools
        run: node check-indexes.mjs
      - name: Unit tests (domain logic, mocked inputs)
        run: npm test
      - run: npm install -g firebase-tools@15.34.1
      - name: Emulator tests (security rules + scan job, mocked sources)
        working-directory: backend
        run: firebase emulators:exec --only firestore,storage --project demo-purrbi "cd functions && npx vitest run test/emulator"
      - name: Trigger end-to-end (real function code, real sources, no AI)
        working-directory: backend
        env:
          E2E_REPORT_PATH: ${{ runner.temp }}/emulator-e2e-report.json
        run: |
          printf 'OPENAI_API_KEY=emulator-placeholder-not-a-real-key\n' > functions/.secret.local
          printf 'AI_ENABLED=false\nSOURCE_USER_AGENT=Purrbi/0.1 (CI emulator test; contact@valenciainnovations.com)\n' > functions/.env.local
          firebase emulators:exec --only auth,firestore,functions,storage --project demo-purrbi "cd functions && npx vitest run test/e2e"
      - name: Publish end-to-end report
        if: always()
        working-directory: backend/tools
        run: node report.mjs "Emulator end-to-end report" "${{ runner.temp }}/emulator-e2e-report.json"
