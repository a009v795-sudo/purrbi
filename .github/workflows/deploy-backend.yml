name: deploy-backend
# Deploys Purrbi's functions (codebase "purrbi"), Firestore rules/indexes and Storage rules.
# Requires the repository secret FIREBASE_SERVICE_ACCOUNT_PURRBI_DEV (service-account JSON key) and
# the Secret Manager secret OPENAI_API_KEY in the target project.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Firebase project id
        required: true
        default: purrbi-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PURRBI_DEV }}
      - run: npm install -g firebase-tools@15.34.1
      - name: Deploy
        working-directory: backend
        run: firebase deploy --only functions:purrbi,firestore:rules,firestore:indexes,storage --project "${{ inputs.project }}" --non-interactive --force
