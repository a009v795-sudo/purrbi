name: live-contract
# Live checks against the real public services (Open Pet Food Facts, Open Food Facts, openFDA,
# knowledge-base citation URLs) from GitHub's network. No mocks, no credentials; products are
# discovered from the databases' own search. The report is published as the job summary and as
# notice annotations, and uploaded as an artifact.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'backend/functions/src/sources/**'
      - 'backend/functions/src/domain/kb.ts'
      - 'backend/functions/src/domain/supplements.ts'
      - 'backend/functions/test/live/**'

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - name: Provider reachability (sanitized HTTP outcomes)
        run: node ../tools/reachability.mjs
        env:
          SOURCE_USER_AGENT: 'Purrbi/0.1 (development build; contact@valenciainnovations.com)'
      - name: Live contract tests
        env:
          LIVE_REPORT_PATH: ${{ runner.temp }}/live-contract-report.json
          SOURCE_USER_AGENT: 'Purrbi/0.1 (development build; contract test; contact@valenciainnovations.com)'
        run: npx vitest run test/live
      - name: Publish report
        if: always()
        run: node ../tools/report.mjs "Live contract report" "${{ runner.temp }}/live-contract-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-contract-report
          path: ${{ runner.temp }}/live-contract-report.json
          if-no-files-found: ignore
