name: live-e2e
# Exercises the DEPLOYED development backend exactly as the app does: temporary test accounts sign up
# with email/password, and every request uses that user's ID token against the public Firestore and
# Storage APIs, so the deployed security rules apply. Real pet products are discovered from Open Pet
# Food Facts' search. No Google Cloud credentials are used; the public web config comes from the
# FlutterFlow export in app/ (the same config the app ships with). Test accounts are deleted at the end.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live end-to-end (client requests only)
        env:
          FIREBASE_PROJECT: purrbi-49c21
          LIVE_REPORT_PATH: ${{ runner.temp }}/live-e2e-report.json
        run: node backend/tools/live-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-e2e-report
          path: ${{ runner.temp }}/live-e2e-report.json
          if-no-files-found: ignore
