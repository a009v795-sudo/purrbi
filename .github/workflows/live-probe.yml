name: live-probe
# Read-only look at what Open Pet Food Facts and its sister databases return for given barcodes
# (status, redirects, product_type, classification fields), from GitHub's network. No credentials.
on:
  workflow_dispatch:
    inputs:
      barcodes:
        description: Barcodes separated by spaces
        required: true
      urls:
        description: Product page URLs to read (optional, space separated); the first barcode is looked for on them
        required: false
        default: ''
      find:
        description: A phrase to locate in the pages' raw HTML (optional)
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe
        env:
          BARCODES: ${{ inputs.barcodes }}
        run: node backend/tools/probe-barcode.mjs $BARCODES
      - name: Pages
        if: ${{ inputs.urls != '' }}
        env:
          URLS: ${{ inputs.urls }}
          BARCODES: ${{ inputs.barcodes }}
          FIND: ${{ inputs.find }}
        run: |
          case "$URLS" in *.pdf*) sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true;; esac
          node backend/tools/probe-page.mjs $URLS --barcode ${BARCODES%% *} ${FIND:+--find "$FIND"}
